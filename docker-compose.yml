version: '3.8'

services:
  ms-audit:
    build: .
    container_name: ms-audit
    ports:
      - "8083:8083"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
    networks:
      - red-compartida

networks:
  red-compartida:
    external: true